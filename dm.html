<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#42303a">
  <title>Muscules | Dungeon Master</title>
  <link rel="stylesheet" href="dm.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="home-auth.css">
  <script src="supabase-config.js"></script>
</head>
<body data-auth-required="dm">
  <main class="dm-screen dm-screen--home" aria-label="Panel de Cherry">
    <button class="home-signout" type="button" data-auth-signout aria-label="Cerrar sesión" aria-describedby="home-signout-error">
      <img src="assets/exit.png" alt="">
    </button>
    <p id="home-signout-error" class="home-signout-error" data-auth-signout-error role="alert" hidden></p>
    <img class="dm-star dm-star--tl" src="assets/sparkle.png" alt="">
    <img class="dm-star dm-star--tr" src="assets/sparkle.png" alt="">
    <img class="dm-star dm-star--bl" src="assets/sparkle.png" alt="">
    <img class="dm-star dm-star--br" src="assets/sparkle.png" alt="">
    <div class="dm-frame"></div>
    <header class="dm-welcome">
      <h1>Bienvenida<br>Cherry</h1>
    </header>
    <img class="dm-neo" src="assets/cherry.png" alt="Cherry">
    <nav class="dm-menu" aria-label="Administración">
      <a class="dm-nav-link dm-nav-link--profile" href="dm-perfil.html">
        <img src="assets/neo icono.png" alt="">
        <span>Perfil</span>
      </a>
      <a class="dm-nav-link dm-nav-link--encounter" href="dm-encuentro.html">
        <img src="assets/encounter.png" alt="">
        <span>Encuentro</span>
      </a>
      <a class="dm-nav-link dm-nav-link--inventory" href="dm-inventario.html">
        <img src="assets/inventory.png" alt="">
        <span>Inventario</span>
      </a>
    </nav>
  </main>
  <script type="module" src="auth-guard.js"></script>
</body>
</html>
