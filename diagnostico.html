<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#42303a">
  <title>Diagnóstico remoto · Muscules</title>
  <link rel="stylesheet" href="auth.css">
  <script src="supabase-config.js"></script>
</head>
<body class="auth-page" data-auth-required="session">
  <main class="auth-panel diagnostic-panel">
    <a class="auth-back" href="index.html">← Volver</a>
    <h1>Diagnóstico remoto</h1>
    <p id="diagnostic-status" class="auth-status" role="status" aria-live="polite">Consultando Supabase…</p>
    <dl id="diagnostic-results" class="diagnostic-results" hidden>
      <div><dt>Rol</dt><dd id="diagnostic-role"></dd></div>
      <div><dt>Partida</dt><dd id="diagnostic-game"></dd></div>
      <div><dt>Actualizado</dt><dd id="diagnostic-updated"></dd></div>
      <div><dt>HP</dt><dd id="diagnostic-hp"></dd></div>
      <div><dt>HP máximo</dt><dd id="diagnostic-max-hp"></dd></div>
      <div><dt>ATK</dt><dd id="diagnostic-atk"></dd></div>
      <div><dt>XP</dt><dd id="diagnostic-xp"></dd></div>
      <div><dt>Arma</dt><dd id="diagnostic-weapon"></dd></div>
      <div><dt>Signo</dt><dd id="diagnostic-sign"></dd></div>
      <div><dt>Nivel</dt><dd id="diagnostic-level"></dd></div>
    </dl>
    <button id="diagnostic-retry" type="button">Volver a consultar</button>
  </main>
  <script type="module" src="auth-guard.js"></script>
  <script type="module" src="diagnostico.js"></script>
</body>
</html>
